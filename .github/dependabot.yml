version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Build requirements are not recorded in uv.lock,
      # so Dependabot cannot relock them and fails the whole update.
      - dependency-name: hatchling
      - dependency-name: hatch-vcs
    groups:
      uv:
        patterns: ["*"]
