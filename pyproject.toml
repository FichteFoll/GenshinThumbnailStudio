[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-thumbnail-studio"
version = "0.1.0"
description = "Standalone Akasha-based Genshin team thumbnail editor"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.2,<13",
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "PyInstaller>=6.10,<7",
  "pytest>=8.2,<9",
]

[project.gui-scripts]
genshin-thumbnail-studio = "genshin_thumbnail_studio.gui:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
