[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-thumbnail-studio"
version = "0.1.0"
description = "Standalone Akasha-based Genshin team thumbnail editor"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.2,<13",
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "PyInstaller>=6.10,<7",
  "pytest>=8.2,<9",
  "basedpyright>=1.39,<2",
]

[project.gui-scripts]
genshin-thumbnail-studio = "genshin_thumbnail_studio.gui:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genshin_thumbnail_studio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.basedpyright]
include = ["src", "tests", "launch.py"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
# Cleaned up module by module; every entry is removed again by the end
# of the basedpyright adoption.
ignore = [
  "src/genshin_thumbnail_studio/akasha.py",
  "src/genshin_thumbnail_studio/gui.py",
  "src/genshin_thumbnail_studio/models.py",
  "src/genshin_thumbnail_studio/renderer.py",
  "src/genshin_thumbnail_studio/storage.py",
  "tests",
]

# The GUI smoke tests deliberately inspect private widget state.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
