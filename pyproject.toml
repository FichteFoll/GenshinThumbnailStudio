[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-thumbnail-studio"
version = "0.2.0"
description = "Standalone Enka-based Genshin team thumbnail editor"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.2,<13",
  "PySide6>=6.7,<7",
  "enka>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "PyInstaller>=6.10,<7",
  "pytest>=8.2,<9",
  "basedpyright>=1.39,<2",
  "ruff>=0.16,<0.17",
]

[project.gui-scripts]
genshin-thumbnail-studio = "genshin_thumbnail_studio.gui:run"

# Pinned past the 2.5.20 release for the `py.typed` marker it added, and further
# past it for PR #212, which adds the missing `__init__.py` files so that marker
# actually reaches `enka.assets.*`.
[tool.uv.sources]
enka = { git = "https://github.com/seriaati/enka-py", rev = "1d6f102f126a20ed5818fc45f2467cd432694f39" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genshin_thumbnail_studio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests", "launch.py"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

# The GUI smoke tests deliberately inspect private widget state.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
