[build-system]
# 1.27 is the first hatchling release to support PEP 639 `license-files`.
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "genshin-thumbnail-studio"
dynamic = ["version"]
description = "Standalone Enka-based Genshin team thumbnail editor"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "Pillow>=10.2,<13",
  "PySide6>=6.7,<7",
  "enka>=2.6,<3",
]

[dependency-groups]
dev = [
  "PyInstaller>=6.10,<7",
  "pytest>=8.2,<10",
  "basedpyright>=1.39,<2",
  "ruff>=0.16,<0.18",
  "packaging>=26,<27",
]
lint = [
  "actionlint-py>=1.7,<2",
  "zizmor>=1.31,<2; python_version >= '3.11'",
]

[project.gui-scripts]
genshin-thumbnail-studio = "genshin_thumbnail_studio.gui:run"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/genshin_thumbnail_studio"]

[tool.uv]
# Rebuild the editable install whenever HEAD or the tags move,
# since the version it reports is taken from git at build time.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests", "packaging"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

# The GUI smoke tests deliberately inspect private widget state.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
