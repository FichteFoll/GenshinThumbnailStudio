[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-thumbnail-studio"
version = "0.1.0"
description = "Standalone Akasha-based Genshin team thumbnail editor"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.2,<13",
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "PyInstaller>=6.10,<7",
  "pytest>=8.2,<9",
  "basedpyright>=1.39,<2",
  "ruff>=0.16,<0.17",
]

[project.gui-scripts]
genshin-thumbnail-studio = "genshin_thumbnail_studio.gui:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genshin_thumbnail_studio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.basedpyright]
include = ["src", "tests", "launch.py"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

# The GUI smoke tests deliberately inspect private widget state.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
