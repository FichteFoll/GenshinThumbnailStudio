[build-system]
# 77 is the first release to take an SPDX `license` expression and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-thumbnail-studio"
version = "1.0.0"
description = "Standalone Enka-based Genshin team thumbnail editor"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "Pillow>=10.2,<13",
  "PySide6>=6.7,<7",
  "enka>=2.6,<3",
]

[dependency-groups]
dev = [
  "PyInstaller>=6.10,<7",
  "pytest>=8.2,<10",
  "basedpyright>=1.39,<2",
  "ruff>=0.16,<0.18",
]
lint = [
  "actionlint-py>=1.7,<2",
  "zizmor>=1.31,<2; python_version >= '3.11'",
]

[project.gui-scripts]
genshin-thumbnail-studio = "genshin_thumbnail_studio.gui:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genshin_thumbnail_studio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests", "packaging"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

# The GUI smoke tests deliberately inspect private widget state.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
